services:
  - type: web
    name: omni-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_NAME
        value: omnimind_db
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
